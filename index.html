<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutor Rush</title>
  <style>
    :root {
      --bg: #171b33;
      --panel: #232a4d;
      --edge: #3b4478;
      --ink: #f4f6ff;
      --accent: #ffd23f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Trebuchet MS", ui-rounded, system-ui, sans-serif;
    }
    /* keeps the whole game, buttons included, on screen on shorter displays */
    #wrap { width: min(960px, 100%, calc((100vh - 40px) * 1.2533)); }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 960 / 766;
      border-radius: 12px;
      background: #d9d7e8;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .hint { opacity: .8; font-size: .9rem; max-width: 52ch; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      background: var(--panel);
      border: 2px solid var(--edge);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; border-color: var(--edge); }
    button.ready { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main id="wrap">
    <canvas id="game" width="960" height="766" aria-label="Tutor Rush, a game about running the help desk at a tutoring center"></canvas>
  </main>

<script>
(function () {
  "use strict";

  /* ================================================================
     Tutor Rush
     Everything you might want to tune is in CONFIG just below.
     ================================================================ */
  const CONFIG = {
    shiftSeconds: 180,          // length of a shift
    tutorSpeed: 340,            // how fast you walk (pixels per second)
    helperSpeed: 190,           // how fast hired student tutors walk (slower than you)
    helperBreak: [3, 5],        // seconds a student tutor rests on the couch after helping
    helperBreakChance: 1,       // 1 = every time, 0.5 = half the time, 0 = never
    maxUpset: 3,                // this many students storming out ends the shift
    plantDrain: 55,             // seconds for a full water meter to run dry (the plant dies at empty)
    plantHealthy: 0.25,         // the plant only grows while its water is above this

    plantMaxLevel: 4,           // how many times a plant can grow

    plantCosts: [60, 110],      // price of the second and third plant
    replantCost: 30,            // price to replace a dead plant

    admireTime: 2.2,            // seconds they spend admiring it
    chattyChance: 0.13,         // chance a new student is the chatty older gentleman
    chattyHelpMult: 2,          // his questions take this many times longer to answer
    helpTime: [1.4, 2.6],       // seconds it takes to answer one question

    patienceEnd: 11,            // ...and late in the shift

    pointsPerAnswer: 10,
    maxSpeedBonus: 10,          // extra points for answering while patience is still high
    pointsHappyLeave: 15,       // bonus when a student finishes and leaves happy
    penaltyUnhappy: 15,         // points lost when a student storms out
    queueMax: 4,                // how many tables you can line up at once
    moneyMin: 2,                // cash for helping a student who was about to give up
    moneyMax: 14,               // cash for helping right after the flag goes up
    startCash: 100,             // cash you begin every shift with
    maxTeam: 3,                 // how many student workers you can hire per shift (the couch seats 3)
    workerCosts: { math: 30, chem: 30, frankie: 40, devon: 60 },   // price of each worker in the hire menu
    owEvery: [3.5, 7],          // seconds between Frankie's "ow"s
    frankiePlantChance: 0.5,    // chance Frankie goes to glare at a plant after helping a student
    frankiePlantWait: [5, 7],   // seconds he stays there complaining
    ratings: [
      { min: 700, label: "Tutor of the year" },
      { min: 450, label: "Great shift" },

      { min: -Infinity, label: "Rough shift" }

  const W = 960, H = 766, TAU = Math.PI * 2;
  const OY = (H - 640) / 2;     // vertical offset that centers the menu panels
  const FONT = '"Trebuchet MS", ui-rounded, system-ui, sans-serif';

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  /* ---------- small helpers ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const span = (r) => rand(r[0], r[1]);

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  function text(str, x, y, size, color, align, weight) {
    ctx.font = (weight || "bold") + " " + size + "px " + FONT;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function outlinedText(str, x, y, size, color) {
    ctx.font = "bold " + size + "px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.lineJoin = "round";
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#232a4d";
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function wrapLines(str, maxW) {
    const words = str.split(" ");
    const lines = [];
    let cur = "";
    for (const w of words) {
      const test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  /* ---------- sound (tiny synthesized beeps, no files) ---------- */
  let audioCtx = null;
  let muted = false;
  function ensureAudio() {
    if (audioCtx) { if (audioCtx.state === "suspended") audioCtx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }
  function tone(freq, dur, type, vol, delay) {
    if (muted || !audioCtx) return;
    try {
      const t0 = audioCtx.currentTime + (delay || 0);
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    } catch (e) { /* sound is optional */ }
  }
  const sfx = {
    flag()  { tone(880, 0.09, "triangle", 0.06); },
    help()  { tone(660, 0.10, "sine", 0.07); tone(990, 0.16, "sine", 0.07, 0.09); },
    cash()  { tone(1318, 0.07, "square", 0.025, 0.12); tone(1760, 0.12, "square", 0.025, 0.19); },
    hire()  { tone(523, 0.09, "triangle", 0.06); tone(659, 0.09, "triangle", 0.06, 0.09); tone(784, 0.2, "triangle", 0.06, 0.18); },
    upset() { tone(190, 0.30, "sawtooth", 0.05); },
    start() { tone(523, 0.10, "triangle", 0.06); tone(784, 0.18, "triangle", 0.06, 0.1); },
    end()   { tone(784, 0.12, "triangle", 0.06); tone(523, 0.12, "triangle", 0.06, 0.12); tone(392, 0.25, "triangle", 0.06, 0.24); }
  };

  /* ---------- saved best score ---------- */
  const BEST_KEY = "tutorRush.best.v2";
  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* ignore */ }
  }

  /* ---------- the room ---------- */
  const MATH = { name: "Math", color: "#f28a1e", qs: [

    "Can I just round pi to 3?", "Is infinity bigger on Mondays?", "Is zero a number or just vibes?",
    "If I add 0 + 0, do I get more?", "Why is a triangle so dramatic?", "Who decided to call it 'negative'?",
    "Is 1 a lonely number?", "Can I carry the 1 to my car?", "Does a parabola ever get tired?",
    "Is a fraction half a number?", "What's the square root of Tuesday?", "Are prime numbers just picky?",
    "Can I borrow a decimal point?", "Is FOIL a baking method?", "Does pi ever finish its sentence?",
    "If x = y, who's winning?", "Can a graph be mad at me?", "Is a right angle never wrong?",
    "How big is a googol in pizzas?", "Why is 'parallel' so jealous?", "Is a matrix a movie or a math?"] };
  const CHEM = { name: "Chemistry", color: "#8a63f2", qs: [
    "Can I turn lead into gold?", "Is water just wet hydrogen?", "Is the periodic table a menu?",
    "Do atoms get lonely?", "What if I mix every liquid?", "Is a mole an animal or 6.02e23?",
    "Why is helium so squeaky?", "Is salt just angry sodium?", "Do electrons ever take a nap?",
    "Why won't oil and water make up?", "Is gold just fancy iron?", "Is a catalyst just a hype man?",
    "Who named it 'noble' gas?", "Is pH a secret code?", "Do bonds have commitment issues?",
    "Is a beaker a tiny bucket?", "Why is dry ice so cool and so dry?", "Is everything just tiny LEGO?",
    "Can I name an element after my dog?", "Is a titration just slow pouring?"] };
  const BIO = { name: "Biology", color: "#2fbf71", qs: [
    "Do cells have feelings?", "Is a tomato a fruit? Fight me.", "Did I evolve from a potato?",
    "Why do we even have spleens?", "Can plants hear my jokes?", "Is a virus alive or just rude?",
    "Do mitochondria get paid?", "Why do my knees crack?", "Is a mushroom a plant or a vibe?",
    "Can I photosynthesize on the couch?", "Are bacteria my roommates?", "Why do we have an appendix?",
    "Do fish get thirsty?", "Is DNA just a long password?", "Do trees gossip underground?",
    "Why is pond scum so dramatic?", "Could a banana be a clone?", "Do bees vote?"] };
  const PHYS = { name: "Physics", color: "#1f3a8a", qs: [
    "Can I outrun a light beam?", "Is gravity just the floor's opinion?", "What if friction took a day off?",
    "Is Schrodinger's cat okay?", "Why can't I walk through walls?", "Do black holes have snacks?",
    "Is a vacuum just empty drama?", "Can I surf a sound wave?", "Is a newton bigger than an apple?",
    "How fast is a falling pizza?", "Do magnets have favorites?", "Is time just a long Tuesday?",
    "What's the speed of a sneeze?", "Is inertia just laziness?", "Why do springs love to boing?",
    "Could I power a toaster with spite?", "Is a quark a cheese?", "Can a pendulum get dizzy?"] };
  const STATS = { name: "Stats", color: "#3d7bff", qs: [
    "Is a 50% chance just 'either way'?", "Can I trust a sample of one?", "If 9 in 10 dentists agree, who's #10?",
    "Is the mean always so mean?", "Is correlation basically dating?", "What are the odds I pass?",
    "Is a bell curve just a hat?", "Can outliers sit with us?", "Is 'average' an insult?",
    "What's the median of a sandwich?", "Is p < 0.05 a vibe check?", "Can I flip a coin to pick my major?",
    "Why is the mode so popular?", "How many data points make a friend?", "Is variance just chaos with a name?",
    "If it rains 30%, is it 30% wet?", "Does a histogram ever rest?", "Is a z-score a grade for weirdness?"] };
  // table order, top-left to bottom-right: 3 Math, 3 Chemistry, 1 Biology, 1 Physics, 1 Stats
  const SUBJECTS = [MATH, CHEM, BIO, PHYS, MATH, CHEM, STATS, CHEM, MATH];

  // what students say when they admire the plant
  const ADMIRE_LINES = [
    "Ooh, such a pretty plant!", "Oh, hello little guy.", "This plant gets me.",
    "Photosynthesis is so calming.", "Ahh. Fresh leaves.", "Best employee here, honestly."
  ];

  // what the student tutors mutter when they flop onto the couch
  const BREAK_LINES = [
    "I need a break.", "Gotta study for my own test...", "Need a snack. Or three.", "My brain is fried.",
    "Five minutes. Don't tell anyone.", "I forgot how to count.", "Is it lunch yet?",
    "I should be doing my own homework.", "Coffee. I need coffee.", "Chemistry broke me.",
    "Who invented Mondays?", "I'm just resting my eyes."
  ];

  // what students mutter on their way out when their patience runs out
  const SNARK = [
    "I'm leaving. I'll ask the plant.",
    "Wow. Five stars. Not.",
    "I aged a year waiting here.",
    "My flag's been up since the Stone Age!",
    "Forget it, I'll learn from a cat video.",
    "Fine. I'll Google it. Like an adult.",
    "Is the flag just decorative?",
    "I've seen glaciers move faster.",
    "Tell my GPA I said goodbye.",
    "I could've solved it twice by now.",
    "Enjoy your desk. Bye!",
    "Next time I'm bringing a snack AND a nap."
  ];

  const COLS = [200, 480, 760];
  const ROWS = [215, 365, 515];
  // The number you press for each table, in reading order (top-left to bottom-right).
  // This matches the layout of a numpad: 7 8 9 on top, then 4 5 6, then 1 2 3.
  // For plain 1 to 9 in reading order, change it to [1, 2, 3, 4, 5, 6, 7, 8, 9].
  const NUMS = [7, 8, 9, 4, 5, 6, 1, 2, 3];
  const AISLE_Y = 280;     // walkway by the door (students come in and leave this way)
  const AISLE2_Y = 430;    // walkway between the second and third rows
  const LOW_Y = 580;       // walkway in front of the third row
  const HOME = { x: 480, y: 724 };
  const DESK = { x: 370, y: 612, w: 220, h: 44 };
  const DESK_AREA = { x: 340, y: 600, w: 300, h: 160 };   // click here to send yourself back to the desk
  const HELPER_SPOTS = [{ x: 769, y: 740 }, { x: 825, y: 740 }, { x: 881, y: 740 }];   // where they stand by the couch
  const HELPER_SEATS = [{ x: 769, y: 676 }, { x: 825, y: 676 }, { x: 881, y: 676 }];   // the couch cushions
  const MAX_HELPERS = Math.min(CONFIG.maxTeam, HELPER_SPOTS.length);

  // Plants live in the bottom-left corner: the first one, then one added to its right, then one on top.
  const PLANT_LANE_X = 104;     // the walkway beside them
  const PLANTS = [
    { slot: 0, x: 46, y: 735 },
    { slot: 1, x: 170, y: 735 },
    { slot: 2, x: 46, y: 605 }
  ].map((p) => Object.assign(p, { unlocked: false, alive: true, water: 1, level: 0, growT: 0 }));
  const PLANT_NODE = ["pb", "pb", "pa"];   // where you stand to water each one

  const TABLES = [];
  ROWS.forEach((cy, r) => COLS.forEach((cx, c) => {
    const id = r * 3 + c;
    TABLES.push({ id, num: NUMS[id], cx, cy, shape: id % 2 ? "square" : "round", subject: SUBJECTS[id], student: null, flag: 0 });
  }));
  const laneX = (t) => t.cx - 96;
  const tableByNum = (n) => TABLES.find((t) => t.num === n);

  /* Walkways for the tutors: a little graph of points so nobody walks through furniture. */
  const NODES = {};
  const ADJ = {};
  function addNode(id, x, y) { NODES[id] = { id, x, y }; ADJ[id] = []; }
  function link(a, b) { ADJ[a].push(b); ADJ[b].push(a); }
  addNode("home", HOME.x, HOME.y);
  addNode("c_low", 330, HOME.y);
  addNode("c_mid", 330, LOW_Y);
  link("home", "c_low"); link("c_low", "c_mid");
  COLS.forEach((cx, c) => {
    addNode("a" + c, cx - 96, AISLE_Y);
    addNode("b" + c, cx - 96, AISLE2_Y);
    addNode("l" + c, cx - 96, LOW_Y);
  });
  TABLES.forEach((t) => addNode("s" + t.id, laneX(t), t.cy + 22));
  link("l0", "c_mid"); link("c_mid", "l1"); link("l1", "l2");
  link("a0", "a1"); link("a1", "a2");
  link("b0", "b1"); link("b1", "b2");
  for (let c = 0; c < 3; c++) {
    link("s" + c, "a" + c);
    link("a" + c, "s" + (c + 3));
    link("s" + (c + 3), "b" + c);
    link("b" + c, "s" + (c + 6));
    link("s" + (c + 6), "l" + c);
  }
  addNode("door", -40, AISLE_Y); link("door", "a0");
  addNode("pa", PLANT_LANE_X, 605); addNode("pb", PLANT_LANE_X, 735); link("l0", "pa"); link("pa", "pb");
  addNode("hub", 664, HELPER_SPOTS[0].y); link("l2", "hub");
  HELPER_SPOTS.forEach((p, i) => { addNode("h" + i, p.x, p.y); link(i === 0 ? "hub" : "h" + (i - 1), "h" + i); });
  HELPER_SEATS.forEach((p, i) => { addNode("q" + i, p.x, p.y); link("h" + i, "q" + i); });

  function route(from, to) {
    const dist = {}, prev = {}, done = {};
    Object.keys(NODES).forEach((k) => { dist[k] = Infinity; });
    dist[from] = 0;
    for (;;) {
      let u = null, best = Infinity;
      for (const k in dist) if (!done[k] && dist[k] < best) { best = dist[k]; u = k; }
      if (u === null || u === to) break;
      done[u] = true;
      ADJ[u].forEach((v) => {
        const d = dist[u] + Math.hypot(NODES[u].x - NODES[v].x, NODES[u].y - NODES[v].y);
        if (d < dist[v]) { dist[v] = d; prev[v] = u; }
      });
    }
    const out = [];
    let n = to;
    while (n !== from) {
      out.unshift(n);
      n = prev[n];
      if (n === undefined) return [];
    }
    return out;
  }

  /* ---------- how students look ---------- */
  const SKINS = ["#f7d3b5", "#e8b48a", "#c68a5e", "#8f5a3a", "#5e3a24"];
  const HAIRS = ["#2b1a12", "#5a3a22", "#b5651d", "#e2b64d", "#3a3a4a", "#c0392b"];
  const SHIRTS = ["#ff8a5c", "#5cc8ff", "#ffd166", "#9b8cff", "#7ee081", "#ff7aa8", "#4dd0c4"];

  /* ---------- the workers you can hire before each shift ---------- */
  const WORKERS = [
    { key: "math", name: "Math student", cost: CONFIG.workerCosts.math, subjects: [MATH], multi: true, randomLook: true,
      quirk: "Just the math, thanks",
      look: { skin: "#e8b48a", hair: "#2b1a12", hairStyle: 0, shirt: "#f28a1e", hoodie: true, cap: "#2c3350", backpack: true } },
    { key: "chem", name: "Chem student", cost: CONFIG.workerCosts.chem, subjects: [CHEM], multi: true, randomLook: true,

      look: { skin: "#c68a5e", hair: "#3a3a4a", hairStyle: 1, shirt: "#8a63f2", hoodie: true, cap: "#ffffff", backpack: true } },
    { key: "frankie", name: "Frankie", cost: CONFIG.workerCosts.frankie, subjects: [BIO, CHEM], quirk: "Says ow. Hates plants.",
      lifeLines: [
        "Why is everything uphill.", "Life is a long Monday.", "Every day is a worse Tuesday.",
        "I had dreams once. Now: tutoring.", "Happiness is a rumor.", "Another day, another disappointment.",
        "Existence is mostly stairs.", "Even my shoes feel sad.", "Hope is just a bad habit.",
        "We're all just waiting to be tired.", "Time keeps going. Rude.", "Nothing ever gets easier. Sure, math."
      ],
      look: { skin: "#e8b48a", hair: "#6b4a2e", hairStyle: 0, shirt: "#7a8f5a", bald: true, beard: "#5b4129", fat: true, lanyard: true } },
    { key: "devon", name: "Devon", cost: CONFIG.workerCosts.devon, subjects: [MATH, CHEM, PHYS, STATS], quirk: "Does everything but biology",

  ];
  const OW_LINES = ["Ow.", "Ow!", "Ow...", "Ow, my back.", "Ow. Again.", "Ooow."];
  const PLANT_HATE = [
    "I hate plants.", "It just sits there. Judging.", "Photosynthesis? Show-off.", "Why am I standing next to it.",
    "It's a stick with ambitions.", "Leaves. Everywhere. Why.", "Plants are salad that won't leave.",
    "It grew again. Gross.", "Nobody asked it to exist.", "Water it yourself."
  ];

  // A few students wear something that says who they are. It is purely cosmetic: they play like everyone else.
  const PRIDE_PINS = [
    ["#e40303", "#ff8c00", "#ffed00", "#008026", "#004dff", "#750787"],   // rainbow
    ["#5bcefa", "#f5a9b8", "#ffffff", "#f5a9b8", "#5bcefa"],              // trans
    ["#d60270", "#d60270", "#9b4f96", "#0038a8", "#0038a8"],              // bi
    ["#ff218c", "#ffd800", "#21b1ff"],                                    // pan
    ["#fcf434", "#ffffff", "#9c59d1", "#2c2c2c"],                         // nonbinary
    ["#2b2b2b", "#a3a3a3", "#ffffff", "#800080"]                          // ace
  ];
  const HAIR_DYES = ["#ff8ad8", "#9b8cff", "#4fd1c5", "#7fd6ff"];
  const GEAR_COLORS = ["#ff6b5e", "#4fa3ff", "#6be39a", "#ffd23f", "#c77dff"];

  function makeLook() {
    const r = Math.random();
    if (r < 0.13) {
      // pride pin, sometimes with dyed hair
      const dye = Math.random() < 0.65 ? pick(HAIR_DYES) : null;
      if (Math.random() < 0.4) return { shirtFlag: pick(PRIDE_PINS), dye };
      return { pin: pick(PRIDE_PINS), dye };
    }
    if (r < 0.26) {
      // headphones, a rainbow infinity pin, a fidget spinner on the table
      const k = randInt(0, 2);
      return { headphones: k !== 1 ? pick(GEAR_COLORS) : null, infinity: k === 1, fidget: k !== 0 ? pick(GEAR_COLORS) : null };
    }
    return null;
  }

  /* ---------- game state ---------- */
  const game = { state: "menu", time: 0, score: 0, cash: CONFIG.startCash, earned: 0, helped: 0, upset: 0, spawnT: 0, best: loadBest(), newBest: false, overAt: 0, shake: 0, failT: 2.4, endReason: "" };
  const students = [];
  const helpers = [];
  const floaters = [];
  const tutor = { x: HOME.x, y: HOME.y, node: "home", path: [], target: null, state: "desk", queue: [], helpT: 0, helpDur: 1, walk: 0, dirY: 0 };
  const ui = { hover: -1, hireHover: null };
  let clock = 0;

  const progress = () => clamp(game.time / CONFIG.shiftSeconds, 0, 1);
  const isSeated = (s) => s.state === "work" || s.state === "ask" || s.state === "help" || s.state === "fume";

  function resetGame() {
    game.time = 0; game.score = 0; game.cash = CONFIG.startCash; game.earned = 0; game.helped = 0; game.upset = 0;
    game.spawnT = 0.5; game.shake = 0; game.newBest = false; game.failT = 2.4; game.endReason = "";
    students.length = 0;
    helpers.length = 0;
    floaters.length = 0;
    TABLES.forEach((t) => { t.student = null; t.flag = 0; });
    PLANTS.forEach((p, i) => Object.assign(p, { unlocked: i === 0, alive: true, water: 1, level: 0, growT: 0 }));
    Object.assign(tutor, { x: HOME.x, y: HOME.y, node: "home", path: [], target: null, state: "desk", queue: [], helpT: 0, walk: 0, dirY: 0 });
  }

  function floater(str, x, y, color) {
    floaters.push({ str, x, y, color, t: 0, life: 1.5 });
  }

  /* ---------- students ---------- */
  function spawnStudent() {
    const free = TABLES.filter((t) => !t.student);
    if (!free.length) return false;
    const t = pick(free);
    const elder = Math.random() < CONFIG.chattyChance;
    const look = elder ? null : makeLook();
    const s = {
      table: t, tid: t.id, x: -30, y: AISLE_Y, dirX: 1, dirY: 0,
      state: "enter",
      path: [{ x: laneX(t), y: AISLE_Y }, { x: laneX(t), y: t.cy - 12 }, { x: t.cx, y: t.cy - 12 }],
      look, elder,
      skin: elder ? "#f7d3b5" : pick(SKINS), hair: elder ? "#dfe3ea" : look && look.dye ? look.dye : pick(HAIRS),
      hairStyle: elder ? 0 : randInt(0, 2), shirt: elder ? "#8a6f4d" : look && look.shirtFlag ? "#f4f4ff" : pick(SHIRTS),
      qLeft: randInt(CONFIG.questionsPerStudent[0], CONFIG.questionsPerStudent[1]),
      timer: 0, patience: 1, patDur: 12, helpProg: 0,
      mood: "neutral", moodT: 0, say: "", sayT: 0,
      question: "", lastQ: -1, walk: rand(0, 6), bob: rand(0, 6)
    };
    t.student = s;
    students.push(s);
    return true;
  }

  function walkPath(o, dist) {
    while (dist > 0 && o.path.length) {
      const n = o.path[0];
      const dx = n.x - o.x, dy = n.y - o.y, d = Math.hypot(dx, dy);
      if (d > 0) { o.dirX = dx / d; o.dirY = dy / d; }
      if (d <= dist) { o.x = n.x; o.y = n.y; o.path.shift(); dist -= d; }
      else { o.x += (dx / d) * dist; o.y += (dy / d) * dist; dist = 0; }
    }
    return o.path.length === 0;
  }

  function startAsking(s) {
    const subj = s.table.subject;
    // draw from a shuffled deck so a question doesn't come back until the rest have been asked
    if (!subj.deck || !subj.deck.length) {
      subj.deck = subj.qs.map((_, k) => k);
      for (let k = subj.deck.length - 1; k > 0; k--) {
        const j = randInt(0, k);
        const tmp = subj.deck[k]; subj.deck[k] = subj.deck[j]; subj.deck[j] = tmp;
      }
    }
    const i = subj.deck.pop();
    s.lastQ = i;
    s.question = subj.qs[i];
    s.patDur = lerp(CONFIG.patienceStart, CONFIG.patienceEnd, progress()) * rand(0.85, 1.15);
    s.patience = 1;
    s.admired = false;
    s.chat = null;
    s.state = "ask";
    sfx.flag();
  }

  function leaveSeat(s, mood) {
    const t = s.table;
    t.student = null;
    s.table = null;
    s.state = "leave";
    s.mood = mood;
    s.moodT = 999;
    s.speed = mood === "angry" ? 230 : 160;
    const lx = t.cx - 96;
    s.path = [{ x: lx, y: s.y }, { x: lx, y: AISLE_Y }, { x: -50, y: AISLE_Y }];
  }

  function nearestLivePlant(s) {
    let best = null, bd = Infinity;
    PLANTS.forEach((p) => {
      if (!p.unlocked || !p.alive) return;
      const d = Math.hypot(p.x - s.x, p.y - s.y);
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }
  function startVisit(s) {
    const t = s.table, pl = nearestLivePlant(s), lx = laneX(t);
    s.admired = true;
    s.plant = pl;
    s.speed = 175;
    s.path = [{ x: lx, y: s.y }, { x: lx, y: LOW_Y }, { x: PLANT_LANE_X, y: LOW_Y }, { x: PLANT_LANE_X, y: pl.y }];
    s.state = "visit";
  }

  function storm(s) {
    const t = s.table;
    game.score -= CONFIG.penaltyUnhappy;
    game.upset++;
    s.say = pick(SNARK);
    s.sayT = 0;
    s.state = "fume";
    s.fumeT = 2.4;
    floater("-" + CONFIG.penaltyUnhappy, t.cx, t.cy - 110, "#ff6b5e");
    if (!RM) game.shake = 0.25;
    sfx.upset();
  }

  function updateStudent(s, dt) {
    s.walk += dt * 11;
    s.bob += dt;
    if (s.moodT > 0 && s.state !== "leave") { s.moodT -= dt; if (s.moodT <= 0) s.mood = "neutral"; }
    if (s.sayT > 0) s.sayT -= dt;
    switch (s.state) {
      case "enter":
        if (walkPath(s, 165 * dt)) { s.state = "work"; s.timer = span(CONFIG.workTime); }
        break;
      case "work":
        s.timer -= dt;
        if (s.timer <= 0) startAsking(s);
        break;
      case "ask":
        s.patience -= dt / s.patDur;
        // about to give up: if there is a living plant (and nobody is already coming to help), go admire it
        if (s.patience > 0 && s.patience <= CONFIG.admireAt && !s.admired && nearestLivePlant(s) && !isClaimed(s.tid)) startVisit(s);
        else if (s.patience <= 0) { s.patience = 0; storm(s); }
        break;
      case "visit":
        if (walkPath(s, s.speed * dt)) {
          s.state = "admire";
          s.moodT = 99;
          if (s.plant.unlocked && s.plant.alive) {
            s.timer = CONFIG.admireTime; s.mood = "happy"; s.noBoost = false;
            s.say = pick(ADMIRE_LINES); s.sayT = CONFIG.admireTime;
          } else {
            s.timer = 1.6; s.mood = "upset"; s.noBoost = true;
            s.say = "Ew. It's dead."; s.sayT = 1.6;
          }
        }
        break;
      case "admire":
        s.timer -= dt;
        if (s.timer <= 0) {
          if (!s.noBoost) s.patience = 1;     // all their patience is back
          const t = s.table, lx = laneX(t);
          s.mood = "neutral"; s.moodT = 0;
          s.path = [{ x: PLANT_LANE_X, y: LOW_Y }, { x: lx, y: LOW_Y }, { x: lx, y: t.cy - 12 }, { x: t.cx, y: t.cy - 12 }];
          s.state = "back";
        }
        break;
      case "back":
        if (walkPath(s, s.speed * dt)) { s.state = "ask"; sfx.flag(); }
        break;
      case "fume":
        s.fumeT -= dt;
        if (s.fumeT <= 0) leaveSeat(s, "angry");
        break;
      case "leave":
        if (walkPath(s, s.speed * dt)) s.done = true;
        break;
    }
  }

  /* ---------- walking along the walkways (used by you and the student tutors) ---------- */
  function pathFor(o, goal) {
    let prefix = [], start = o.node;
    if (o.path.length) { prefix = [o.path[0]]; start = o.path[0]; }
    return prefix.concat(route(start, goal));
  }
  function stepAlong(o, speed, dt) {
    let rem = speed * dt;
    if (o.path.length) o.walk += dt * speed * 0.038;
    while (rem > 0 && o.path.length) {
      const n = NODES[o.path[0]];
      const dx = n.x - o.x, dy = n.y - o.y, d = Math.hypot(dx, dy);
      if (d > 0) o.dirY = dy / d;
      if (d <= rem) { o.x = n.x; o.y = n.y; o.node = n.id; o.path.shift(); rem -= d; }
      else { o.x += (dx / d) * rem; o.y += (dy / d) * rem; rem = 0; }
    }
  }
  function travelTime(o, goal, speed) {
    let x = o.x, y = o.y, d = 0;
    pathFor(o, goal).forEach((id) => { d += Math.hypot(NODES[id].x - x, NODES[id].y - y); x = NODES[id].x; y = NODES[id].y; });
    return d / speed;
  }

  /* ---------- answering a question (same payout whoever does it) ---------- */
  function finishAnswer(t, s) {
    const pts = CONFIG.pointsPerAnswer + Math.round(CONFIG.maxSpeedBonus * s.patience);
    // The sooner the student got help, the more money it earns.
    const cash = Math.round(lerp(CONFIG.moneyMin, CONFIG.moneyMax, s.patience));
    game.score += pts;
    game.cash += cash;
    game.earned += cash;
    game.helped++;
    floater("+" + pts, t.cx, t.cy - 110, "#6be39a");
    floater("+$" + cash, t.cx, t.cy - 134, "#ffd23f");
    sfx.help();
    sfx.cash();
    s.qLeft--;
    if (s.qLeft > 0) {
      s.state = "work";
      s.timer = span(CONFIG.workTime);
      s.mood = "happy"; s.moodT = 1.4;
      s.say = "Thanks!"; s.sayT = 1.3;
    } else {
      game.score += CONFIG.pointsHappyLeave;
      floater("+" + CONFIG.pointsHappyLeave + " ♥", t.cx, t.cy - 158, "#ffb3d1");
      leaveSeat(s, "happy");
    }
  }

  /* ---------- you (the tutor at the desk) ---------- */
  // targets are table ids 0 to 8, and plant ids 9 to 11
  const isPlantId = (id) => id >= 9;
  const plantOf = (id) => PLANTS[id - 9];
  const plantUsable = (p) => p.unlocked && p.alive;
  const goalNode = (id) => (isPlantId(id) ? PLANT_NODE[id - 9] : "s" + id);

  function planNext() {
    while (tutor.queue.length) {
      const id = tutor.queue.shift();
      if (isPlantId(id) && !plantUsable(plantOf(id))) continue;
      tutor.target = id;
      tutor.path = pathFor(tutor, goalNode(id));
      tutor.state = "walk";
      return true;
    }
    return false;
  }
  function dispatch() {
    if (!planNext()) {
      tutor.target = null;
      tutor.path = pathFor(tutor, "home");
      tutor.state = "walk";
    }
  }
  function startHelp(id) {
    const s = TABLES[id].student;
    s.state = "help";
    s.helpProg = 0;
    tutor.state = "help";
    tutor.helpT = 0;
    tutor.helpDur = span(CONFIG.helpTime) * (s.elder ? CONFIG.chattyHelpMult : 1);
  }
  function finishHelp() {
    const t = TABLES[tutor.target];
    finishAnswer(t, t.student);
    tutor.target = null;
    dispatch();
  }
  function startWater() {
    tutor.state = "water";
    tutor.helpT = 0;
    tutor.helpDur = CONFIG.waterTime;
    tutor.waterFrom = plantOf(tutor.target).water;
  }
  function finishWater() {
    const p = plantOf(tutor.target);
    if (p.alive) { p.water = 1; floater("Watered!", p.x, p.y - 100, "#7ec8ff"); sfx.help(); }
    tutor.target = null;
    dispatch();
  }
  function goHome() {
    tutor.queue.length = 0;
    if (tutor.state === "help" || tutor.state === "water" || tutor.state === "desk") return;
    tutor.target = null;
    tutor.path = pathFor(tutor, "home");
    tutor.state = "walk";
  }
  function updateTutor(dt) {
    tutor.queue = tutor.queue.filter((id) => !isPlantId(id) || plantUsable(plantOf(id)));
    if (tutor.state === "walk" && tutor.target !== null && isPlantId(tutor.target) && !plantUsable(plantOf(tutor.target))) {
      tutor.target = null;
      dispatch();
    }
    if (tutor.state === "desk") {
      if (tutor.queue.length) planNext();
    } else if (tutor.state === "walk") {
      if (tutor.target === null && tutor.queue.length) planNext();
      stepAlong(tutor, CONFIG.tutorSpeed, dt);
      if (tutor.path.length === 0) {
        if (tutor.target === null) { tutor.state = "desk"; tutor.x = HOME.x; tutor.y = HOME.y; tutor.node = "home"; }
        else if (isPlantId(tutor.target)) startWater();
        else {
          const s = TABLES[tutor.target].student;
          if (s && s.state === "ask") startHelp(tutor.target);
          else tutor.state = "post";    // wait at the table: you jump in the moment they raise the flag
        }
      }
    } else if (tutor.state === "post") {
      const s = TABLES[tutor.target].student;
      if (s && s.state === "ask") startHelp(tutor.target);
      else if (tutor.queue.length) planNext();
    } else if (tutor.state === "help") {
      tutor.helpT += dt;
      const s = TABLES[tutor.target].student;
      s.helpProg = clamp(tutor.helpT / tutor.helpDur, 0, 1);
      if (tutor.helpT >= tutor.helpDur) finishHelp();
    } else if (tutor.state === "water") {
      tutor.helpT += dt;
      const p = plantOf(tutor.target);
      if (p.alive) p.water = Math.max(p.water, lerp(tutor.waterFrom, 1, clamp(tutor.helpT / tutor.helpDur, 0, 1)));
      if (tutor.helpT >= tutor.helpDur) finishWater();
    }
  }

  // send yourself to a table (even one with nobody asking) or to a plant
  function requestGo(id) {
    if (game.state !== "play") return;
    if (isPlantId(id) && !plantUsable(plantOf(id))) return;
    if (tutor.target === id || tutor.queue.indexOf(id) !== -1) return;
    if (tutor.queue.length >= CONFIG.queueMax) return;
    tutor.queue.push(id);
  }

  /* ---------- student tutors (hired with cash, they find work on their own) ---------- */
  const team = [];   // keys of the workers picked in the hire menu
  const workerOf = (key) => WORKERS.find((w) => w.key === key);

  function makeHelper(w, i) {
    const look = Object.assign({}, w.look);
    if (w.randomLook) { look.skin = pick(SKINS); look.hair = pick(HAIRS); look.hairStyle = randInt(0, 1); }
    return {
      x: -40, y: AISLE_Y, node: "door", path: [], target: null, state: "idle",
      think: 0, helpT: 0, helpDur: 1, walk: 0, dirY: 0, spot: "h" + i, seat: "q" + i, sitting: false, breakT: 0, say: "", sayT: 0,
      w, subjects: w.subjects, look, owT: rand(CONFIG.owEvery[0], CONFIG.owEvery[1]), plantNode: null, plantT: 0, lineT: 0, lines: []
    };
  }

  // Why a worker can't be hired right now (or "" when they can).
  function hireBlock(w) {
    if (team.length >= MAX_HELPERS) return "Team full";
    if (!w.multi && team.indexOf(w.key) !== -1) return "Already hired";
    if (game.cash < w.cost) return "Not enough cash";
    return "";
  }
  function addWorker(i) {
    const w = WORKERS[i];
    if (game.state !== "hire" || !w || hireBlock(w)) return;
    team.push(w.key);
    game.cash -= w.cost;
    sfx.hire();
  }
  function removeWorker(slot) {
    if (game.state !== "hire" || slot < 0 || slot >= team.length) return;
    game.cash += workerOf(team[slot]).cost;
    team.splice(slot, 1);
  }

  function isClaimed(id) {
    return tutor.target === id || tutor.queue.indexOf(id) !== -1 || helpers.some((h) => h.target === id);
  }
  // Pick the most urgent waiting student that this helper can actually reach in time.
  function chooseTarget(h) {
    let best = null, bestLeft = Infinity;
    TABLES.forEach((t) => {
      const s = t.student;
      if (h.subjects.indexOf(t.subject) === -1 || !s || s.state !== "ask" || isClaimed(t.id)) return;
      const left = s.patience * s.patDur;
      if (left - travelTime(h, "s" + t.id, CONFIG.helperSpeed) < 0.4) return;
      if (left < bestLeft) { bestLeft = left; best = t.id; }
    });
    return best;
  }
  const isFrankie = (h) => h.w.key === "frankie";
  function startPlantVisit(h) {
    const plants = PLANTS.filter(plantUsable);
    if (!plants.length) return false;
    const pl = pick(plants);
    h.plantNode = PLANT_NODE[pl.slot];
    h.state = "plant";
    h.sitting = false;
    h.plantT = 0;
    h.lineT = 0;
    h.arrived = false;
    h.lines = PLANT_HATE.slice().sort(() => Math.random() - 0.5);
    h.path = pathFor(h, h.plantNode);
    return true;
  }
  function updateHelper(h, dt) {
    h.think -= dt;
    if (h.sayT > 0) h.sayT -= dt;
    if (isFrankie(h)) {
      h.owT -= dt;
      if (h.owT <= 0) {
        h.owT = span(CONFIG.owEvery);
        if (!(h.sayT > 0)) { h.say = pick(OW_LINES); h.sayT = 1.3; }
      }
    }
    if (h.state === "help") {
      h.helpT += dt;
      const t = TABLES[h.target];
      const s = t.student;
      if (!s || s.state !== "help") { h.target = null; h.state = "idle"; return; }
      s.helpProg = clamp(h.helpT / h.helpDur, 0, 1);
      if (h.helpT >= h.helpDur) {
        finishAnswer(t, s);
        h.target = null;
        h.think = 0;
        if (h.w.lifeLines) { h.say = pick(h.w.lifeLines); h.sayT = 2.6; }   // grumbling on the way back
        if (isFrankie(h) && Math.random() < CONFIG.frankiePlantChance && startPlantVisit(h)) return;
        if (Math.random() < CONFIG.helperBreakChance) { h.state = "rest"; h.sitting = false; h.path = pathFor(h, h.seat); }
        else h.state = "idle";
      }
      return;
    }
    if (h.state === "plant") {
      // walk to a plant, stand there a few seconds, complain about it
      if (h.path.length) { stepAlong(h, CONFIG.helperSpeed, dt); return; }
      if (h.node !== h.plantNode) { h.path = pathFor(h, h.plantNode); return; }
      if (!h.arrived) { h.arrived = true; h.plantT = span(CONFIG.frankiePlantWait); h.lineT = 0; }
      h.plantT -= dt;
      h.lineT -= dt;
      if (h.lineT <= 0 && h.plantT > 0.8 && h.lines.length) {
        h.say = h.lines.pop();
        h.sayT = 1.9;
        h.lineT = 1.9;
      }
      if (h.plantT <= 0) { h.state = "idle"; h.think = 0; }
      return;
    }
    if (h.state === "rest") {
      // walk to the couch, flop down, grumble, rest a few seconds
      if (h.sitting) {
        h.breakT -= dt;
        if (h.breakT <= 0) { h.sitting = false; h.state = "idle"; h.think = 0; }
      } else {
        stepAlong(h, CONFIG.helperSpeed, dt);
        if (h.path.length === 0) {
          if (h.node === h.seat) {
            h.sitting = true;
            h.breakT = span(CONFIG.helperBreak);
            h.say = pick(BREAK_LINES);
            h.sayT = Math.min(2.8, h.breakT);
          } else {
            h.path = pathFor(h, h.seat);
          }
        }
      }
      return;
    }
    if (h.target !== null) {
      const s = TABLES[h.target].student;
      if (!(s && s.state === "ask")) { h.target = null; h.path = pathFor(h, h.spot); }  // someone else got there first
    }
    if (h.target === null && h.think <= 0) {
      h.think = 0.25;
      const id = chooseTarget(h);
      if (id !== null) {
        h.target = id; h.path = pathFor(h, "s" + id);
        if (h.w.lifeLines) { h.say = pick(h.w.lifeLines); h.sayT = 2.6; }   // grumbling on the way over
      }
    }
    stepAlong(h, CONFIG.helperSpeed, dt);
    if (h.path.length === 0) {
      if (h.target !== null) {
        const s = TABLES[h.target].student;
        if (s && s.state === "ask") {
          s.state = "help";
          s.helpProg = 0;
          h.state = "help";
          h.helpT = 0;
          h.helpDur = span(CONFIG.helpTime) * (s.elder ? CONFIG.chattyHelpMult : 1);
        } else {
          h.target = null;
        }
      } else if (h.node !== h.spot) {
        h.path = pathFor(h, h.spot);
      }
    }
  }

  /* ---------- plants ---------- */
  function updatePlants(dt) {
    PLANTS.forEach((p) => {
      if (!p.unlocked || !p.alive) return;
      p.water -= dt / CONFIG.plantDrain;
      if (p.water <= 0) {
        p.water = 0;
        p.alive = false;
        floater("The plant died!", p.x + 30, p.y - 100, "#e0b97a");
        sfx.upset();
        return;
      }
      if (p.water >= CONFIG.plantHealthy && p.level < CONFIG.plantMaxLevel) {
        p.growT += dt;
        if (p.growT >= CONFIG.plantGrowSeconds) {
          p.growT = 0;
          p.level++;
          floater("The plant grew!", p.x + 30, p.y - 100, "#6be39a");
          sfx.cash();
        }
      }
    });
  }
  function waterThirstiest() {
    let best = null;
    PLANTS.forEach((p) => { if (plantUsable(p) && (best === null || p.water < best.water)) best = p; });
    if (best) requestGo(9 + best.slot);
  }
  function plantOffer() {
    if (PLANTS.some((p) => p.unlocked && !p.alive)) return { kind: "replant", cost: CONFIG.replantCost };
    const n = PLANTS.filter((p) => p.unlocked).length;
    if (n < PLANTS.length) return { kind: "buy", cost: CONFIG.plantCosts[n - 1] };
    return null;
  }
  function buyPlant() {
    if (game.state !== "play") return;
    const o = plantOffer();
    if (!o || game.cash < o.cost) return;
    game.cash -= o.cost;
    const p = o.kind === "replant" ? PLANTS.find((q) => q.unlocked && !q.alive) : PLANTS.find((q) => !q.unlocked);
    Object.assign(p, { unlocked: true, alive: true, water: 1, level: 0, growT: 0 });
    floater("-$" + o.cost, 330, 112, "#ff9d8f");
    floater(o.kind === "replant" ? "Replanted!" : "New plant!", p.x + 30, p.y - 100, "#6be39a");
    sfx.hire();
  }

  /* ---------- main update ---------- */
  function update(dt) {
    game.time += dt;
    if (game.time >= CONFIG.shiftSeconds) { endShift(); return; }
    if (game.upset >= CONFIG.maxUpset) {
      game.failT -= dt;     // a moment to watch the last student storm out
      if (game.failT <= 0) { endShift("Three students stormed out."); return; }
    }

    game.spawnT -= dt;
    if (game.spawnT <= 0) {
      if (spawnStudent()) {
        game.spawnT = (students.length <= 1 ? 2.5 : lerp(CONFIG.spawnStart, CONFIG.spawnEnd, progress())) * rand(0.8, 1.2);
      } else {
        game.spawnT = 0.8;
      }
    }

    students.forEach((s) => updateStudent(s, dt));
    for (let i = students.length - 1; i >= 0; i--) if (students[i].done) students.splice(i, 1);
    updateTutor(dt);
    helpers.forEach((h) => updateHelper(h, dt));
    updatePlants(dt);

    TABLES.forEach((t) => {
      const want = t.student && (t.student.state === "ask" || t.student.state === "help") ? 1 : 0;
      t.flag += clamp(want - t.flag, -dt * 5, dt * 5);
    });
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.t += dt;
      f.y -= 34 * dt;
      if (f.t >= f.life) floaters.splice(i, 1);
    }
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
  }

  // Every shift starts at the hire menu: pick who works for you, then the clock starts.
  function openHire() {
    ensureAudio();
    resetGame();
    team.length = 0;
    game.state = "hire";
    updateButtons();
  }
  function startGame() {
    helpers.length = 0;
    team.forEach((key, i) => helpers.push(makeHelper(workerOf(key), i)));
    game.state = "play";
    sfx.start();
    updateButtons();
  }
  function endShift(reason) {
    game.endReason = reason || "Time's up!";
    game.state = "over";
    game.overAt = performance.now();
    if (game.score > game.best) { game.best = game.score; game.newBest = true; saveBest(game.best); }
    sfx.end();
    updateButtons();
  }
  function togglePause() {
    if (game.state === "play") game.state = "paused";
    else if (game.state === "paused") game.state = "play";
    updateButtons();
  }
  function primary() {
    if (game.state === "menu") openHire();
    else if (game.state === "hire") startGame();
    else if (game.state === "over") { if (performance.now() - game.overAt > 700) openHire(); }
    else if (game.state === "paused") togglePause();
  }
  function toggleMute() {
    muted = !muted;
    updateButtons();
  }
  function updateButtons() { /* pause and sound are drawn in the top bar now */ }

  /* ---------- drawing: people ---------- */
  function drawFace(hx, hy, mood) {
    ctx.strokeStyle = "#2b2230";
    ctx.fillStyle = "#2b2230";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    if (mood === "happy") {
      ctx.beginPath(); ctx.arc(hx - 6.5, hy + 3.5, 2.8, Math.PI, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + 6.5, hy + 3.5, 2.8, Math.PI, TAU); ctx.stroke();
      dot(hx - 11, hy + 8, 3, "rgba(255,120,150,.45)");
      dot(hx + 11, hy + 8, 3, "rgba(255,120,150,.45)");
    } else {
      dot(hx - 6.5, hy + 3, 2.3, "#2b2230");
      dot(hx + 6.5, hy + 3, 2.3, "#2b2230");
    }
    if (mood === "upset" || mood === "angry") {
      ctx.beginPath(); ctx.moveTo(hx - 11, hy - 4); ctx.lineTo(hx - 3, hy - 0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx + 11, hy - 4); ctx.lineTo(hx + 3, hy - 0.5); ctx.stroke();
    } else if (mood === "worried") {
      ctx.beginPath(); ctx.moveTo(hx - 11, hy - 0.5); ctx.lineTo(hx - 3, hy - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx + 11, hy - 0.5); ctx.lineTo(hx + 3, hy - 4); ctx.stroke();
    }
    ctx.beginPath();
    if (mood === "happy") ctx.arc(hx, hy + 7, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
    else if (mood === "neutral") ctx.arc(hx, hy + 8, 3.6, 0.2 * Math.PI, 0.8 * Math.PI);
    else if (mood === "worried") { ctx.moveTo(hx - 3.5, hy + 11); ctx.lineTo(hx + 3.5, hy + 11); }
    else ctx.arc(hx, hy + 14, 4.8, 1.2 * Math.PI, 1.8 * Math.PI);
    ctx.stroke();
    if (mood === "worried") {
      ctx.fillStyle = "#6ec1ff";
      ctx.beginPath(); ctx.moveTo(hx + 16, hy - 12); ctx.quadraticCurveTo(hx + 20, hy - 5, hx + 16, hy - 3); ctx.quadraticCurveTo(hx + 12, hy - 5, hx + 16, hy - 12); ctx.fill();
    }
  }

  // round pin with horizontal stripes
  function drawPin(px, py, colors) {
    const r = 8;
    const h = (r * 2) / colors.length;
    ctx.save();
    ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.clip();
    colors.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(px - r, py - r + i * h, r * 2, h + 0.6); });
    ctx.restore();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.stroke();
  }
  // rainbow infinity symbol on a white badge
  function drawInfinityPin(px, py) {
    dot(px, py, 9, "#ffffff");
    const g = ctx.createLinearGradient(px - 7, py, px + 7, py);
    ["#ff4d4d", "#ff9f43", "#ffd93d", "#4cd964", "#4d8dff", "#9b5de5"].forEach((c, i) => g.addColorStop(i / 5, c));
    ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.bezierCurveTo(px + 3, py - 5, px + 7, py - 5, px + 7, py);
    ctx.bezierCurveTo(px + 7, py + 5, px + 3, py + 5, px, py);
    ctx.bezierCurveTo(px - 3, py - 5, px - 7, py - 5, px - 7, py);
    ctx.bezierCurveTo(px - 7, py + 5, px - 3, py + 5, px, py);
    ctx.stroke();
  }
  function drawHeadphones(hx, hy, color) {
    ctx.strokeStyle = "#2c3350"; ctx.lineWidth = 4.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(hx, hy + 1, 20.5, Math.PI * 1.04, Math.PI * 1.96); ctx.stroke();
    ctx.fillStyle = "#2c3350"; rr(hx - 25, hy - 6, 9, 17, 4); ctx.fill(); rr(hx + 16, hy - 6, 9, 17, 4); ctx.fill();
    ctx.fillStyle = color; rr(hx - 24, hy - 4, 6, 13, 3); ctx.fill(); rr(hx + 18, hy - 4, 6, 13, 3); ctx.fill();
  }
  function drawSpinner(x, y, color, speed) {
    const a = RM ? 0.4 : clock * speed;
    for (let i = 0; i < 3; i++) {
      const ang = a + (i * TAU) / 3;
      dot(x + Math.cos(ang) * 6.5, y + Math.sin(ang) * 4.5, 3.6, color);
    }
    dot(x, y, 3.2, "#e8ebf2");
    dot(x, y, 1.3, "#8a93b8");
  }

  function drawPerson(x, y, o) {
    const bob = o.bob || 0;
    const hx = x, hy = y - 56 + bob;
    const back = o.view === "back";
    const L = o.look;
    const fw = o.fat ? 1.3 : 1;            // body width
    const bald = o.elder || o.bald;
    if (!o.seated) {
      ctx.fillStyle = "rgba(30,30,70,.18)";
      ctx.beginPath(); ctx.ellipse(x, y + 1, 19 * fw, 6, 0, 0, TAU); ctx.fill();
      const sw = Math.sin(o.walk || 0) * 3;
      if (o.pants) {
        // long legs in cargo pants, with a pocket flap on each
        ctx.fillStyle = o.pants;
        rr(x - 14, y - 22 + sw, 13, 22, 3); ctx.fill();
        rr(x + 1, y - 22 - sw, 13, 22, 3); ctx.fill();
        ctx.fillStyle = "rgba(10,20,60,.28)";
        rr(x - 12, y - 12 + sw, 9, 7, 1.5); ctx.fill();
        rr(x + 3, y - 12 - sw, 9, 7, 1.5); ctx.fill();
        ctx.fillStyle = "#2c3350";
        rr(x - 15, y - 3 + sw, 14, 4, 2); ctx.fill();
        rr(x + 1, y - 3 - sw, 14, 4, 2); ctx.fill();
      } else {
        ctx.fillStyle = "#39406b";
        rr(x - 13, y - 10 + sw, 11, 11, 3); ctx.fill();
        rr(x + 2, y - 10 - sw, 11, 11, 3); ctx.fill();
      }
    }
    ctx.fillStyle = o.shirt;
    rr(x - 21 * fw, y - 44 + bob, 42 * fw, o.pants ? 31 : 38, 14); ctx.fill();
    if (L && L.shirtFlag) {
      ctx.save();
      rr(x - 21, y - 44 + bob, 42, 38, 14); ctx.clip();
      const sh = 38 / L.shirtFlag.length;
      L.shirtFlag.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x - 21, y - 44 + bob + i * sh, 42, sh + 0.6); });
      ctx.restore();
    }
    if (!o.seated) {
      const as = Math.sin(o.walk || 0) * 2.5;
      ctx.fillStyle = o.shirt;
      rr(x - 21 * fw - 8, y - 40 + bob + as, 10, 24, 5); ctx.fill();
      rr(x + 21 * fw - 2, y - 40 + bob - as, 10, 24, 5); ctx.fill();
      if (o.cuffs) {
        ctx.fillStyle = o.cuffs;
        rr(x - 21 * fw - 8, y - 23 + bob + as, 10, 6, 3); ctx.fill();
        rr(x + 21 * fw - 2, y - 23 + bob - as, 10, 6, 3); ctx.fill();
      }
      dot(x - 21 * fw - 3, y - 14 + bob + as, 4.5, o.skin);
      dot(x + 21 * fw + 3, y - 14 + bob - as, 4.5, o.skin);
    }
    if (o.lanyard && !back) {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(x - 7, y - 43 + bob); ctx.lineTo(x, y - 27 + bob); ctx.lineTo(x + 7, y - 43 + bob); ctx.stroke();
      ctx.fillStyle = "#ffffff"; rr(x - 5, y - 28 + bob, 10, 12, 2); ctx.fill();
      ctx.fillStyle = "#3d7bff"; ctx.fillRect(x - 5, y - 28 + bob, 10, 3);
    }
    if (L && !back) {
      if (L.pin) drawPin(x + 11, y - 29 + bob, L.pin);
      if (L.infinity) drawInfinityPin(x + 11, y - 29 + bob);
    }
    if (o.hoodie) {
      ctx.fillStyle = "rgba(0,0,0,.16)"; rr(x - 13, y - 22 + bob, 26, 13, 6); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      if (!back) {
        ctx.beginPath(); ctx.moveTo(x - 5, y - 43 + bob); ctx.lineTo(x - 5, y - 33 + bob); ctx.moveTo(x + 5, y - 43 + bob); ctx.lineTo(x + 5, y - 33 + bob); ctx.stroke();
      }
    }
    if (o.backpack) {
      ctx.fillStyle = "#2c3350";
      if (back) { rr(x - 16, y - 42 + bob, 32, 30, 9); ctx.fill(); ctx.fillStyle = "#3b4478"; rr(x - 10, y - 26 + bob, 20, 10, 4); ctx.fill(); }
      else { rr(x - 17, y - 44 + bob, 5, 30, 2); ctx.fill(); rr(x + 12, y - 44 + bob, 5, 30, 2); ctx.fill(); }
    }
    // hair that hangs behind the head
    if (o.hairStyle === 1) { ctx.fillStyle = o.hair; rr(hx - 19.5, hy - 12, 39, 36, 13); ctx.fill(); }
    if (o.hairStyle === 2) dot(hx, hy - 21, 7.5, o.hair);
    if (o.hairStyle === 3) { ctx.fillStyle = o.hair; rr(hx - 20.5, hy - 12, 41, 56, 14); ctx.fill(); }   // long hair
    if (o.hoodie) { ctx.fillStyle = o.shirt; ctx.beginPath(); ctx.ellipse(hx, hy + 19, 21, 8, 0, 0, TAU); ctx.fill(); }
    if (back) {
      dot(hx - 18, hy + 3, 3.2, o.skin);
      dot(hx + 18, hy + 3, 3.2, o.skin);
      dot(hx, hy, 18.5, bald ? o.skin : o.hair);
      if (bald) { dot(hx - 17, hy - 1, 5, o.hair); dot(hx + 17, hy - 1, 5, o.hair); }
    } else {
      dot(hx, hy, 18, o.skin);
      if (o.beard) {
        // full beard with a skin-coloured patch left for the mouth
        ctx.save();
        ctx.beginPath(); ctx.arc(hx, hy, 18, 0, TAU); ctx.clip();
        ctx.fillStyle = o.beard; ctx.fillRect(hx - 20, hy + 5.5, 40, 16);
        ctx.restore();
        ctx.fillStyle = o.beard; ctx.beginPath(); ctx.ellipse(hx, hy + 14, 15, 7.5, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = o.skin; ctx.beginPath(); ctx.ellipse(hx, hy + 10, 7.5, 4.5, 0, 0, TAU); ctx.fill();
      }
      if (bald) {
        dot(hx - 17, hy - 1, 5, o.hair); dot(hx + 17, hy - 1, 5, o.hair);
        dot(hx - 15, hy - 8, 4, o.hair); dot(hx + 15, hy - 8, 4, o.hair);
        ctx.fillStyle = "rgba(255,255,255,.45)";
        ctx.beginPath(); ctx.ellipse(hx - 5, hy - 12, 6, 3, -0.4, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = o.hair;
        ctx.beginPath();
        ctx.moveTo(hx - 18, hy - 2);
        ctx.arc(hx, hy, 18.5, Math.PI, TAU);
        ctx.quadraticCurveTo(hx + 2, hy - 14, hx - 18, hy - 2);
        ctx.closePath();
        ctx.fill();
      }
      drawFace(hx, hy, o.mood || "neutral");
      if (o.elder) {
        ctx.strokeStyle = o.hair; ctx.lineWidth = 3.4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(hx - 11, hy - 2.5); ctx.lineTo(hx - 3, hy - 3.5); ctx.moveTo(hx + 3, hy - 3.5); ctx.lineTo(hx + 11, hy - 2.5); ctx.stroke();
        ctx.fillStyle = o.hair; rr(hx - 7.5, hy + 6, 15, 4, 2); ctx.fill();
      }
      if (o.glasses) {
        ctx.strokeStyle = "#1c1f33"; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(hx - 6.5, hy + 3, 5.4, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(hx + 6.5, hy + 3, 5.4, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx - 1.1, hy + 3); ctx.lineTo(hx + 1.1, hy + 3); ctx.stroke();
      }
    }
    if (o.cap) {
      ctx.fillStyle = o.cap;
      ctx.beginPath(); ctx.arc(hx, hy - 3, 19.5, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill();
      if (!back) { rr(hx - 21, hy - 6, 42, 5, 2.5); ctx.fill(); }
    }
    if (L && L.headphones) drawHeadphones(hx, hy, L.headphones);
  }

  function moodOf(s) {
    if (s.state === "leave") return s.mood;
    if (s.state === "fume") return "angry";
    if (s.state === "visit") return "worried";
    if (s.state === "admire") return s.mood === "upset" ? "upset" : "happy";
    if (s.mood === "happy" && s.moodT > 0) return "happy";
    if (s.state === "ask") return s.patience > 0.6 ? "neutral" : s.patience > 0.3 ? "worried" : "upset";
    return "neutral";
  }

  function drawWalker(s) {
    const view = s.dirY < -0.4 ? "back" : "front";
    drawPerson(s.x, s.y, { skin: s.skin, hair: s.hair, hairStyle: s.hairStyle, shirt: s.shirt, look: s.look, elder: s.elder, glasses: s.elder, view, mood: moodOf(s), walk: s.walk });
    if (s.state === "leave") {
      if (s.mood === "angry") { if (!(s.sayT > 0)) outlinedText("!!", s.x + 20, s.y - 78, 18, "#ff6b5e"); }
      else outlinedText("♥", s.x + 20, s.y - 78, 18, "#ffb3d1");
    }
  }

  function drawTutor() {
    const seated = tutor.state === "desk";
    const view = seated || (tutor.state === "walk" && tutor.dirY < -0.2) ? "back" : "front";
    const bob = (tutor.state === "help" || tutor.state === "water") && !RM ? Math.sin(clock * 9) * 1.2 : 0;
    drawPerson(tutor.x, tutor.y, {
      skin: "#c98e64", hair: "#35200f", hairStyle: 2, shirt: "#1fa38a",
      view, mood: tutor.state === "help" || tutor.state === "water" ? "happy" : "neutral",
      walk: tutor.walk, seated, glasses: true, lanyard: true, bob
    });
  }

  function drawHelper(h) {
    const helping = h.state === "help";
    const moving = h.path.length > 0;
    const view = !h.sitting && moving && h.dirY < -0.2 ? "back" : "front";
    const bob = helping && !RM ? Math.sin(clock * 9 + h.walk) * 1.2 : 0;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.scale(0.86, 0.86);   // a bit smaller than you: they're younger
    drawPerson(0, 0, Object.assign({}, h.look, {
      backpack: h.look.backpack && !h.sitting, view, mood: helping ? "happy" : "neutral", walk: h.walk, seated: h.sitting, bob
    }));
    ctx.restore();
  }

  /* ---------- drawing: tables ---------- */
  function tablePath(t, dy, grow) {
    grow = grow || 0;
    if (t.shape === "round") { ctx.beginPath(); ctx.ellipse(t.cx, t.cy + dy, 54 + grow, 37 + grow, 0, 0, TAU); }
    else rr(t.cx - 54 - grow, t.cy - 35 + dy - grow, 108 + grow * 2, 72 + grow * 2, 14 + grow);
  }

  function patienceColor(p) { return "hsl(" + Math.round(120 * clamp(p, 0, 1)) + " 75% 46%)"; }

  function drawMeter(x, y, w, h, frac, color) {
    ctx.fillStyle = "#232a4d";
    rr(x, y, w, h, h / 2); ctx.fill();
    if (frac > 0.01) { ctx.fillStyle = color; rr(x + 2, y + 2, Math.max(h - 4, (w - 4) * frac), h - 4, (h - 4) / 2); ctx.fill(); }
  }

  function drawBubble(x, y, str) {
    ctx.font = "bold 12px " + FONT;
    const lines = wrapLines(str, 100);
    let w = 0;
    lines.forEach((l) => { w = Math.max(w, ctx.measureText(l).width); });
    w += 16;
    const h = lines.length * 15 + 10;
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#232a4d"; ctx.lineWidth = 2; ctx.lineJoin = "round";
    rr(x, y, w, h, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 1, y + h - 14); ctx.lineTo(x - 9, y + h - 5); ctx.lineTo(x + 1, y + h - 6); ctx.closePath();
    ctx.fillStyle = "#ffffff"; ctx.fill();
    lines.forEach((l, i) => text(l, x + 8, y + 17 + i * 15, 12, "#232a4d", "left"));
  }

  function drawShout(x, yb, str, calm) {
    ctx.font = "bold 13px " + FONT;
    const bg = calm ? "#f2f6ff" : "#fff4f2", edge = calm ? "#3d4a8a" : "#c0392b", ink = calm ? "#232a4d" : "#7a1f16";
    const lines = wrapLines(str, 130);
    let w = 0;
    lines.forEach((l) => { w = Math.max(w, ctx.measureText(l).width); });
    w += 18;
    const h = lines.length * 16 + 10;
    const bx = clamp(x - w / 2, 6, W - w - 6);
    const by = Math.max(62, yb - h - 8);
    const tx = clamp(x, bx + 12, bx + w - 12);
    ctx.fillStyle = bg; ctx.strokeStyle = edge; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
    rr(bx, by, w, h, 9); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx - 6, by + h); ctx.lineTo(tx, by + h + 9); ctx.lineTo(tx + 6, by + h); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = bg; ctx.fillRect(tx - 5, by + h - 2, 10, 4);
    lines.forEach((l, i) => text(l, bx + 9, by + 17 + i * 16, 13, ink, "left"));
  }

  function drawPlant(p) {
    const k = 1 + 0.12 * p.level;
    const x = p.x, y = p.y;
    const dead = !p.alive;
    const thirsty = p.water < 0.3;
    ctx.fillStyle = "rgba(40,40,90,.16)";
    ctx.beginPath(); ctx.ellipse(x, y + 3, 26 * k, 7 * k, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dead ? "#a5694f" : "#c26b4a";
    rr(x - 17 * k, y - 28 * k, 34 * k, 28 * k, 6 * k); ctx.fill();
    ctx.fillStyle = "#5a3d2b";
    rr(x - 15 * k, y - 31 * k, 30 * k, 7 * k, 3.5 * k); ctx.fill();
    const g1 = dead ? "#8b7a45" : thirsty ? "#9bb04a" : "#3aa06a";
    const g2 = dead ? "#74653a" : thirsty ? "#85993d" : "#2f8a58";
    const d = dead ? 12 * k : thirsty ? 5 * k : 0;
    dot(x, y - 46 * k + d, 15 * k, g1);
    dot(x - 11 * k, y - 38 * k + d, 11 * k, g2);
    dot(x + 11 * k, y - 38 * k + d, 11 * k, g2);
    if (p.level >= 1) dot(x, y - 58 * k + d * 0.7, 10 * k, g1);
    if (p.level >= 2) { dot(x - 14 * k, y - 52 * k + d * 0.7, 8 * k, g2); dot(x + 14 * k, y - 52 * k + d * 0.7, 8 * k, g2); }
    if (p.level >= 3 && !dead) { dot(x - 5 * k, y - 68 * k, 4 * k, "#ff8ad8"); dot(x + 7 * k, y - 64 * k, 4 * k, "#ffd23f"); }
    if (p.level >= 4 && !dead) { dot(x + 14 * k, y - 56 * k, 3.5 * k, "#ff8ad8"); dot(x - 13 * k, y - 60 * k, 3.5 * k, "#ffffff"); }
    if (dead) text("RIP", x, y - 10 * k, 10 * k, "#fff3df", "center");
    if (tutor.state === "water" && tutor.target === 9 + p.slot) {
      for (let i = 0; i < 4; i++) dot(x - 12 + i * 8, y - 70 * k + ((clock * 70 + i * 17) % 40), 2.4, "#7ec8ff");
    }
    if (!dead) {
      // water meter, like the students' patience meters
      const my = y - 80 * k - 6;
      const flash = p.water < 0.2 && Math.floor(clock * 6) % 2 === 0;
      drawMeter(x - 28, my, 56, 11, p.water, flash ? "#ffffff" : "#4fa3ff");
      ctx.fillStyle = "#4fa3ff";

    const w = lerp(15, 30, raise), h = lerp(10, 19, raise);

      text(label, 480, 204, 44, "#ffd23f", "center");
      text(String(game.score), 480, 280, 72, "#ffffff", "center");
      text("points", 480, 306, 18, "#9aa3d6", "center", "normal");
      text("Questions answered: " + game.helped, 480, 346, 20, "#6be39a", "center", "normal");
      text("Students who left upset: " + game.upset, 480, 374, 20, "#ff8479", "center", "normal");
      text("Cash earned: $" + game.earned + "  (" + helpers.length + " student tutor" + (helpers.length === 1 ? "" : "s") + " hired)", 480, 402, 20, "#ffd23f", "center", "normal");
      text(game.newBest ? "New best score!" : "Best score: " + game.best, 480, 436, 20, game.newBest ? "#ffd23f" : "#9aa3d6", "center", "normal");
      button("Hire your team", 462);
    } else if (game.state === "paused") {
      panel(300, 240, 360, 150);
      text("Paused", 480, 308, 40, "#ffd23f", "center");
      text("Press P or Esc to resume", 480, 348, 18, "#c9d0f5", "center", "normal");
    }
    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    if (game.shake > 0 && !RM) ctx.translate(rand(-3, 3) * (game.shake / 0.25), rand(-3, 3) * (game.shake / 0.25));
    drawRoom();
    const items = [];
    TABLES.forEach((t) => items.push({ y: t.cy, draw: () => drawTable(t) }));
    students.forEach((s) => { if (!isSeated(s)) items.push({ y: s.y, draw: () => drawWalker(s) }); });
    helpers.forEach((h) => items.push({ y: h.y, draw: () => drawHelper(h) }));
    items.push({ y: 677.5, draw: drawCouchFront });
    PLANTS.forEach((p) => { if (p.unlocked) items.push({ y: p.y, draw: () => drawPlant(p) }); });
    items.push({ y: tutor.y, draw: drawTutor });
    items.sort((a, b) => a.y - b.y);
    items.forEach((it) => it.draw());
    students.forEach((s) => {
      if (s.state === "fume" && s.table) drawShout(s.table.cx, s.table.cy - 92, s.say);
      if (s.state === "admire" && s.sayT > 0) drawShout(s.x, s.y - 80, s.say, true);
    });
    helpers.forEach((h) => { if (h.sayT > 0) drawShout(h.x, h.y - 74, h.say, true); });
    floaters.forEach((f) => {
      ctx.globalAlpha = clamp(1 - Math.pow(f.t / f.life, 3), 0, 1);
      outlinedText(f.str, f.x, f.y, 22, f.color);
    });
    ctx.globalAlpha = 1;
    ctx.restore();
    drawHUD();
    drawOverlay();
  }

  /* ---------- input ---------- */
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * W) / r.width, y: ((e.clientY - r.top) * H) / r.height };
  }
  // the table under the pointer; where two overlap, the one whose middle is closest wins
  function tableAt(x, y) {
    let best = -1, bestD = Infinity;
    for (const t of TABLES) {
      if (x >= t.cx - 74 && x <= t.cx + 74 && y >= t.cy - 118 && y <= t.cy + 48) {
        const d = Math.abs(y - (t.cy - 30));
        if (d < bestD) { bestD = d; best = t.id; }
      }
    }
    return best;
  }
  function plantAt(x, y) {
    for (const pl of PLANTS) {
      if (!pl.unlocked) continue;
      const k = 1 + 0.12 * pl.level;
      if (Math.abs(x - pl.x) <= 40 * k && y >= pl.y - 95 * k && y <= pl.y + 8) return 9 + pl.slot;
    }
    return -1;
  }
  const inBtn = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  canvas.addEventListener("pointerdown", (e) => {
    ensureAudio();
    const p = toGame(e);
    if (inBtn(p, BTN_SOUND)) { toggleMute(); return; }
    if (inBtn(p, BTN_PAUSE)) { if (game.state === "play" || game.state === "paused") togglePause(); return; }
    if (game.state === "hire") {
      const hit = hireHit(p);
      if (!hit) return;
      if (hit.kind === "card") addWorker(hit.i);
      else if (hit.kind === "slot") removeWorker(hit.i);
      else startGame();
      return;
    }
    if (game.state !== "play") { primary(); return; }
    const id = tableAt(p.x, p.y);
    if (id !== -1) { requestGo(id); return; }
    const pid = plantAt(p.x, p.y);
    if (pid !== -1) { requestGo(pid); return; }
    if (inBtn(p, DESK_AREA)) goHome();
  });
  canvas.addEventListener("pointermove", (e) => {
    const p = toGame(e);
    ui.hover = game.state === "play" ? tableAt(p.x, p.y) : -1;
    ui.hireHover = game.state === "hire" ? hireHit(p) : null;
    const overPlant = game.state === "play" && plantAt(p.x, p.y) !== -1;
    const overDesk = game.state === "play" && inBtn(p, DESK_AREA);
    const overBtn = inBtn(p, BTN_SOUND) || (inBtn(p, BTN_PAUSE) && (game.state === "play" || game.state === "paused"));
    canvas.style.cursor = ui.hover !== -1 || overPlant || overDesk || overBtn || ui.hireHover ? "pointer" : "default";
  });
  canvas.addEventListener("pointerleave", () => { ui.hover = -1; canvas.style.cursor = "default"; });
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    // number row and numpad (also works with NumLock off)
    let d = 0;
    if (e.code && /^(Digit|Numpad)[1-9]$/.test(e.code)) d = Number(e.code.slice(-1));
    else if (k && k.length === 1 && k >= "1" && k <= "9") d = Number(k);
    if (game.state === "hire") {
      if (d) { addWorker(d - 1); return; }
      if (k === "Backspace") { e.preventDefault(); removeWorker(team.length - 1); return; }
    }
    if (d) {
      const t = tableByNum(d);
      if (t) requestGo(t.id);
      return;
    }
    if (k === "p" || k === "P" || k === "Escape") { togglePause(); return; }
    if (k === "m" || k === "M") { toggleMute(); return; }
    if (k === "w" || k === "W") { waterThirstiest(); return; }
    if (k === "b" || k === "B") { buyPlant(); return; }
    if (k === "0" || (e.code && /^(Digit|Numpad)0$/.test(e.code))) { goHome(); return; }
    if ((k === "Enter" || k === " ") && !(e.target && e.target.tagName === "BUTTON")) { e.preventDefault(); primary(); }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && game.state === "play") togglePause(); });

  /* ---------- loop ---------- */
  let last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    clock += dt;
    if (game.state === "play") update(dt);
    render();
  }
  updateButtons();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
